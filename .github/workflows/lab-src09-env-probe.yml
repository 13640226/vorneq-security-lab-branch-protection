name: LAB SRC09 Branch-Restricted Environment
on:
  push:
    branches: ["feature/src09"]
permissions:
  contents: read
jobs:
  environment-isolation-probe:
    if: github.repository == '13640226/vorneq-security-lab-branch-protection'
    environment: lab-trusted-gate
    runs-on: ubuntu-latest
    steps:
      - name: Report synthetic canary presence only
        env:
          LAB_GATE_CANARY: ${{ secrets.LAB_GATE_CANARY }}
        run: |
          if [ -n "$LAB_GATE_CANARY" ]; then
            echo "CANARY_PRESENT=true"
          else
            echo "CANARY_PRESENT=false"
          fi
