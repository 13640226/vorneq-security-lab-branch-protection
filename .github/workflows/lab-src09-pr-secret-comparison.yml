name: LAB SRC09 Same-Repo PR Secret Visibility
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  ordinary-repository-secret:
    if: github.repository == '13640226/vorneq-security-lab-branch-protection' && github.head_ref == 'feature/src09'
    runs-on: ubuntu-latest
    steps:
      - name: Report synthetic canary presence only, never values
        env:
          LAB_REPO_CANARY: ${{ secrets.LAB_REPO_CANARY }}
          LAB_GATE_CANARY: ${{ secrets.LAB_GATE_CANARY }}
        run: |
          if [ -n "$LAB_REPO_CANARY" ]; then echo "REPO_CANARY_PRESENT=true"; else echo "REPO_CANARY_PRESENT=false"; fi
          if [ -n "$LAB_GATE_CANARY" ]; then echo "ENV_CANARY_WITHOUT_ENV_PRESENT=true"; else echo "ENV_CANARY_WITHOUT_ENV_PRESENT=false"; fi
  environment-secret-attempt:
    if: github.repository == '13640226/vorneq-security-lab-branch-protection' && github.head_ref == 'feature/src09'
    environment: lab-trusted-gate
    runs-on: ubuntu-latest
    steps:
      - name: Report synthetic protected canary presence only
        env:
          LAB_GATE_CANARY: ${{ secrets.LAB_GATE_CANARY }}
        run: |
          if [ -n "$LAB_GATE_CANARY" ]; then echo "ENV_CANARY_PRESENT=true"; else echo "ENV_CANARY_PRESENT=false"; fi
